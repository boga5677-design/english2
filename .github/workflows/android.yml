name: Build TOEIC 3000 v5 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"

      - name: Validate project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/toeic_words.tsv
          echo "Vocabulary rows:"
          awk -F '\t' 'NF >= 3 {n++} END {print n+0}' app/src/main/assets/toeic_words.tsv

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: TOEIC3000-v5-Stable-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
